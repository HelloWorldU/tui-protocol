<!doctype html>
<html lang="en">
  <head>

    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
      .fixture { position: absolute; left: 0; top: 0; }
      #manual { margin-top: 16px; }
      pre { white-space: pre-wrap; }

  <body>
    <main>
      <h1>xterm Lines Host Browser Checks</h1>

      <section id="manual" aria-label="Manual selection">

        <button id="copy">Copy selection</button>
        <pre id="copied" aria-label="Copied text"></pre>
      </section>
    </main>
